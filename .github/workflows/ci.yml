name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  kit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Type-check examples
        run: npx tsc -p tsconfig.json

      - name: Kit rules on examples
        run: node .fluent-kit/scripts/check.mjs .github/skills/fluent-ui/examples

      - name: Lint rule tests
        run: |
          node .fluent-kit/eslint/no-hardcoded-styles.test.js
          node .fluent-kit/eslint/fluent-only.test.js

      - name: Reading-cost budgets (per route)
        run: node tests/reading-cost.mjs

      - name: Links in shipped files
        run: node tests/links.mjs

      - name: Benchmark recorder tests
        run: node tests/record-run.test.mjs

      - name: check --finish tests
        run: node tests/check-finish.test.mjs
      - name: doctor tests
        run: node tests/doctor.test.mjs

      - name: context.mjs tests
        run: node tests/context.test.mjs

      - name: Shipped scripts pass ESLint recommended
        run: npx eslint -c tests/eslint.shipped.config.mjs .fluent-kit install.mjs

      - name: Script syntax
        run: for f in install.mjs .fluent-kit/scripts/*.mjs tests/*.mjs; do node --check "$f"; done

      - name: Installer smoke test
        run: bash tests/installer-smoke.sh

  # The scripts spawn git, tsc and npm, build paths and read files: the parts that differ between systems.
  platform:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Every test runs even if an earlier one fails, and a failure's output is also written as an annotation
      # (the job log itself is not always readable from outside GitHub).
      - name: Tests
        run: |
          failed=0
          t() {
            local out
            if out=$("$@" 2>&1); then echo "ok: $*"; else
              failed=1; echo "$out"
              echo "::error title=FAILED $*::$(printf '%s\n' "$out" | head -c 1800 | awk 'BEGIN{ORS="%0A"}{print}')"
            fi
          }
          t node tests/record-run.test.mjs
          t node tests/check-finish.test.mjs
          t node tests/context.test.mjs
          t node tests/doctor.test.mjs
          t bash tests/installer-smoke.sh
          exit $failed
      - name: Script syntax
        run: for f in install.mjs .fluent-kit/scripts/*.mjs tests/*.mjs; do node --check "$f"; done
